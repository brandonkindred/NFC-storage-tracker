<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TagBin — NFC Storage Tracker · UI Prototype</title>
<style>
/* ============================================================
   TagBin — NFC Storage Tracker
   High-fidelity, self-contained mobile UI prototype
   Design tokens ▸ light + dark themes below
   ============================================================ */
:root{
  /* accent */
  --primary:#4F46E5; --primary-600:#4338CA; --primary-050:#EEF0FE;
  --accent:#7C3AED; --grad:linear-gradient(135deg,#5B5BF0,#8B5CF6);
  --grad-warm:linear-gradient(135deg,#6366F1,#A855F7);
  --success:#34C759; --warning:#FF9F0A; --danger:#FF3B30; --info:#0A84FF;
  /* surfaces (light) */
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#FFFFFF; --raised:#FFFFFF;
  --fill:#7676801F; --fill-2:#78788028;
  --text:#111114; --text-2:#60606A; --text-3:#9A9AA2;
  --separator:rgba(60,60,67,.12); --sep-strong:rgba(60,60,67,.22);
  --shadow:0 1px 2px rgba(17,17,20,.06),0 8px 24px rgba(17,17,20,.08);
  --shadow-lg:0 12px 40px rgba(17,17,20,.16);
  --tabbar:rgba(255,255,255,.82);
  --nav:rgba(242,242,247,.8);
  /* shape + type */
  --r-sm:10px; --r:16px; --r-lg:22px; --r-xl:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --primary:#7C7CF5; --primary-600:#6E6EF0; --primary-050:#20203A;
  --accent:#A78BFA; --grad:linear-gradient(135deg,#6D6DF2,#9B7BF6);
  --grad-warm:linear-gradient(135deg,#7C7CF5,#B58BF6);
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --raised:#1C1C1E;
  --fill:#7676803D; --fill-2:#7878805C;
  --text:#FFFFFF; --text-2:#A0A0AB; --text-3:#6C6C74;
  --separator:rgba(84,84,88,.42); --sep-strong:rgba(84,84,88,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  --tabbar:rgba(28,28,30,.78);
  --nav:rgba(20,20,22,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:
    radial-gradient(1100px 700px at 15% -10%, #E9E8FF 0%, transparent 55%),
    radial-gradient(1000px 700px at 100% 0%, #F3E8FF 0%, transparent 50%),
    #EDECF3;
  color:#1c1c1e; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 16px 48px; gap:22px;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(1100px 700px at 15% -10%, #16162b 0%, transparent 55%),
    radial-gradient(1000px 700px at 100% 0%, #1c1230 0%, transparent 50%),
    #08080c;
  color:#fff;
}
/* ---------- stage chrome ---------- */
.stage-head{width:100%;max-width:920px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:11px}
.brandmark .logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(91,91,240,.4)}
.brandmark .logo svg{width:22px;height:22px}
.brandmark b{font-size:19px;letter-spacing:-.4px}
.brandmark span{display:block;font-size:12px;opacity:.6;font-weight:500;margin-top:1px}
.stage-head .spacer{flex:1}
.ctrl{border:1px solid var(--sep-strong);background:rgba(255,255,255,.6);backdrop-filter:blur(8px);
  color:inherit;font-family:var(--font);font-size:13px;font-weight:600;
  padding:9px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
:root[data-theme="dark"] .ctrl{background:rgba(40,40,46,.6)}
.ctrl:hover{transform:translateY(-1px)}
.ctrl svg{width:15px;height:15px}
.hint{width:100%;max-width:920px;font-size:12.5px;opacity:.55;text-align:center;margin-top:-8px}
/* ---------- device ---------- */
.device{
  width:390px;max-width:calc(100vw - 24px);
  height:844px;max-height:calc(100vh - 40px);
  min-height:640px;
  background:#0b0b0d;border-radius:54px;padding:13px;
  box-shadow:var(--shadow-lg),0 0 0 2px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.06);
  position:relative;flex:none;
}
.screen{
  position:relative;width:100%;height:100%;background:var(--bg);color:var(--text);
  border-radius:42px;overflow:hidden;display:flex;flex-direction:column;
}
/* status bar */
.statusbar{height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 8px;font-size:15px;font-weight:600;color:var(--text);position:relative;z-index:5}
.statusbar .r{display:flex;align-items:center;gap:6px}
.statusbar .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:118px;height:33px;background:#000;border-radius:20px}
:root[data-theme="dark"] .statusbar .notch{background:#000}
/* scroll body */
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view::-webkit-scrollbar{width:0}
.pad{padding:0 20px}
.pad-b{padding-bottom:110px}
/* nav bar */
.nav{position:sticky;top:0;z-index:4;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--separator);padding:6px 12px 10px;display:flex;align-items:center;gap:6px}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--primary);font-size:16px;font-weight:500;
  background:none;border:none;cursor:pointer;padding:6px 4px;font-family:var(--font)}
.nav .back svg{width:19px;height:19px}
.nav .title{flex:1;text-align:center;font-size:16px;font-weight:650;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .act{color:var(--primary);font-size:16px;font-weight:500;background:none;border:none;cursor:pointer;
  padding:6px 4px;font-family:var(--font);display:flex;align-items:center;justify-content:center}
.nav .act svg{width:22px;height:22px}
.nav .side{min-width:64px;display:flex;align-items:center}
.nav .side.r{justify-content:flex-end}
/* typography */
.h1{font-size:33px;font-weight:800;letter-spacing:-.9px;line-height:1.05;margin:6px 0 2px}
.h2{font-size:22px;font-weight:750;letter-spacing:-.5px;margin:20px 0 10px}
.sub{color:var(--text-2);font-size:15px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-head h3{font-size:18px;font-weight:750;letter-spacing:-.3px;margin:0}
.section-head a{color:var(--primary);font-size:14.5px;font-weight:600;text-decoration:none}
/* cards / lists */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:.5px solid var(--separator);
  cursor:pointer;transition:background .12s;color:inherit;text-decoration:none;background:transparent}
.row:last-child{border-bottom:none}
.row:active{background:var(--fill)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:13.5px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.row .chev{color:var(--text-3);flex:none}
.row .chev svg{width:16px;height:16px;display:block}
.row .trail{font-size:15px;color:var(--text-3);flex:none}
/* thumb / avatar */
.thumb{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:22px;
  color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.thumb.lg{width:58px;height:58px;border-radius:15px;font-size:27px}
.thumb.sm{width:38px;height:38px;border-radius:10px;font-size:18px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12.5px;
  font-weight:600;background:var(--fill);color:var(--text-2)}
.chip svg{width:13px;height:13px}
.chip.tint{background:var(--primary-050);color:var(--primary)}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:4px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 13px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1}
.stat .l{font-size:12px;color:var(--text-2);margin-top:5px;font-weight:600}
.stat .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-bottom:9px;color:#fff}
.stat .ic svg{width:15px;height:15px}
/* search field */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:10px 12px;color:var(--text-3);font-size:16px;cursor:text}
.search svg{width:18px;height:18px;flex:none}
.search input{border:none;background:none;outline:none;font-family:var(--font);font-size:16px;color:var(--text);width:100%}
.search input::placeholder{color:var(--text-3)}
/* big scan cta */
.scan-cta{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;color:#fff;
  background:var(--grad-warm);box-shadow:0 14px 34px rgba(99,91,240,.42);cursor:pointer;margin-top:16px}
.scan-cta .rings{position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.35}
.scan-cta h3{margin:0;font-size:20px;font-weight:750;letter-spacing:-.3px}
.scan-cta p{margin:4px 0 0;font-size:13.5px;opacity:.9;max-width:210px}
.scan-cta .go{margin-top:15px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);
  backdrop-filter:blur(6px);padding:9px 16px;border-radius:999px;font-weight:650;font-size:14px}
.scan-cta .go svg{width:17px;height:17px}
/* container cards (horizontal) */
.hscroll{display:flex;gap:13px;overflow-x:auto;padding:2px 20px 4px;margin:0 -20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ccard{flex:none;width:158px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.ccard .top{height:96px;display:grid;place-items:center;font-size:40px;position:relative;color:#fff}
.ccard .top .tag{position:absolute;top:9px;right:9px;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);
  border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px}
.ccard .top .tag svg{width:11px;height:11px}
.ccard .bot{padding:11px 13px 13px}
.ccard .bot b{font-size:15px;font-weight:650;letter-spacing:-.2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .bot span{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:4px;margin-top:3px}
.ccard .bot span svg{width:12px;height:12px}
/* grid of containers */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.gcard{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.gcard .top{height:88px;display:grid;place-items:center;font-size:38px;color:#fff;position:relative}
.gcard .top .tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.28);border-radius:999px;padding:3px 7px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:3px}
.gcard .top .tag svg{width:10px;height:10px}
.gcard .bot{padding:10px 12px 12px}
.gcard .bot b{font-size:14.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .bot span{font-size:12px;color:var(--text-2);margin-top:2px;display:block}
/* activity feed */
.feed{display:flex;flex-direction:column;gap:2px}
.fitem{display:flex;gap:12px;align-items:center;padding:11px 4px}
.fitem .fic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.fitem .fic svg{width:17px;height:17px}
.fitem .ftx{flex:1;min-width:0}
.fitem .ftx p{margin:0;font-size:14.5px;line-height:1.3}
.fitem .ftx p b{font-weight:650}
.fitem .ftx time{font-size:12px;color:var(--text-3)}
/* hero (container detail) */
.hero{height:186px;position:relative;display:grid;place-items:center;color:#fff}
.hero .emoji{font-size:74px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.32))}
.hero .float-nav{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:2}
.hero .circ{width:34px;height:34px;border-radius:999px;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);
  display:grid;place-items:center;color:#fff;border:none;cursor:pointer}
.hero .circ svg{width:19px;height:19px}
.hero .info{position:absolute;left:20px;bottom:16px;z-index:2}
.hero .info h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.6px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.hero .info .meta{display:flex;gap:8px;margin-top:8px}
.hero .info .meta .chip{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
/* item detail */
.item-hero{height:220px;display:grid;place-items:center;font-size:96px;color:#fff;position:relative}
.qty{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:999px;box-shadow:var(--shadow)}
.qty button{width:40px;height:40px;border:none;background:none;color:var(--primary);font-size:22px;cursor:pointer;font-family:var(--font)}
.qty b{min-width:34px;text-align:center;font-size:17px;font-weight:700}
/* meta rows (key/value) */
.kv{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:.5px solid var(--separator);font-size:15.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600;display:flex;align-items:center;gap:7px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:15px;
  font-size:16.5px;font-weight:650;border:none;cursor:pointer;font-family:var(--font);transition:.15s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 22px rgba(79,70,229,.34)}
.btn.primary:active{transform:scale(.985)}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger)}
.btn-row{display:flex;gap:11px}
.btn-row .btn{flex:1}
/* FAB */
.fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:19px;background:var(--primary);
  color:#fff;border:none;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 26px rgba(79,70,229,.5);z-index:6;transition:.15s}
.fab:active{transform:scale(.94)}
.fab svg{width:27px;height:27px}
/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;padding-bottom:20px;
  background:var(--tabbar);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--separator);
  display:flex;align-items:flex-start;padding-top:10px;z-index:7}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);
  background:none;border:none;cursor:pointer;font-family:var(--font);font-size:10.5px;font-weight:600}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--primary)}
.tab.scan-tab{position:relative}
.tab.scan-tab .btn-scan{width:56px;height:56px;border-radius:19px;background:var(--grad);margin-top:-24px;
  display:grid;place-items:center;box-shadow:0 10px 24px rgba(91,91,240,.5)}
.tab.scan-tab .btn-scan svg{width:27px;height:27px;color:#fff}
.tab.scan-tab span{margin-top:2px}
/* scan overlay screen */
.scan-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;color:#fff;
  background:radial-gradient(120% 90% at 50% 18%, #4b40b8 0%, #2b2350 55%, #14111f 100%)}
:root[data-theme="dark"] .scan-screen{background:radial-gradient(120% 90% at 50% 18%, #3a3196 0%, #1c1740 55%, #05040a 100%)}
.scan-screen .top{display:flex;justify-content:flex-end;padding:52px 20px 0}
.scan-screen .top button{background:rgba(255,255,255,.16);border:none;color:#fff;width:36px;height:36px;
  border-radius:999px;display:grid;place-items:center;cursor:pointer}
.scan-screen .top button svg{width:20px;height:20px}
.scan-screen .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
.pulse{position:relative;width:180px;height:180px;display:grid;place-items:center;margin-bottom:34px}
.pulse .ring{position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,255,255,.5);animation:pulse 2.4s ease-out infinite}
.pulse .ring:nth-child(2){animation-delay:.8s}
.pulse .ring:nth-child(3){animation-delay:1.6s}
@keyframes pulse{0%{transform:scale(.42);opacity:.9}100%{transform:scale(1);opacity:0}}
.pulse .core{width:96px;height:96px;border-radius:30px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.pulse .core svg{width:46px;height:46px;color:#fff}
.scan-screen h2{font-size:24px;font-weight:750;margin:0 0 8px;letter-spacing:-.4px}
.scan-screen p{font-size:15px;opacity:.82;margin:0;max-width:250px;line-height:1.4}
.scan-screen .foot{padding:0 24px 44px;display:flex;flex-direction:column;gap:10px}
.scan-screen .simbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;
  padding:13px;border-radius:14px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:var(--font);backdrop-filter:blur(6px)}
.scan-screen .simbtn b{font-weight:750}
.check{width:104px;height:104px;border-radius:999px;background:var(--success);display:grid;place-items:center;
  margin-bottom:26px;box-shadow:0 12px 34px rgba(52,199,89,.5);animation:pop .4s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.check svg{width:56px;height:56px;color:#fff}
/* sheet (add item / pair) */
.sheet-scr{position:absolute;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;
  animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grabber{height:5px;width:38px;border-radius:999px;background:var(--sep-strong);margin:9px auto 0}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--text-2);margin:0 0 7px 3px;letter-spacing:-.1px}
.input{width:100%;background:var(--surface);border:.5px solid var(--separator);border-radius:13px;padding:14px 15px;
  font-size:16px;font-family:var(--font);color:var(--text);outline:none}
.input.tap{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.input.tap .ph{color:var(--text-3)}
.input.tap .val{display:flex;align-items:center;gap:9px;font-weight:500}
.input.tap svg{width:16px;height:16px;color:var(--text-3)}
.photo-drop{height:120px;border-radius:15px;border:2px dashed var(--sep-strong);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;color:var(--text-3);cursor:pointer;background:var(--fill)}
.photo-drop svg{width:26px;height:26px}
.photo-drop span{font-size:13px;font-weight:600}
.pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:2px}
.pick-grid .p{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:22px;cursor:pointer;color:#fff;position:relative}
.pick-grid .p.on::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--primary)}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-family:var(--font);
  font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
/* empty state */
.empty{text-align:center;padding:56px 30px}
.empty .ic{width:80px;height:80px;border-radius:24px;background:var(--fill);display:grid;place-items:center;margin:0 auto 18px;color:var(--text-3)}
.empty .ic svg{width:38px;height:38px}
.empty h3{margin:0 0 6px;font-size:19px;font-weight:700}
.empty p{margin:0 auto;font-size:14.5px;color:var(--text-2);max-width:230px;line-height:1.4}
/* profile */
.prof-head{display:flex;align-items:center;gap:15px;padding:6px 2px 4px}
.prof-head .av{width:66px;height:66px;border-radius:999px;background:var(--grad);display:grid;place-items:center;
  color:#fff;font-size:26px;font-weight:700;box-shadow:0 8px 20px rgba(91,91,240,.4)}
.prof-head b{font-size:22px;font-weight:750;letter-spacing:-.4px}
.prof-head span{color:var(--text-2);font-size:14px}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--fill-2);position:relative;cursor:pointer;transition:.2s;flex:none}
.toggle.on{background:var(--success)}
.toggle .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.toggle.on .knob{left:22px}
.mini-ic{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.mini-ic svg{width:16px;height:16px}
/* misc */
.divider-lbl{font-size:12.5px;color:var(--text-3);font-weight:600;margin:16px 4px 8px;letter-spacing:.2px}
.notes{background:var(--surface);border-radius:var(--r);padding:15px;font-size:14.5px;color:var(--text-2);line-height:1.5;box-shadow:var(--shadow)}
.fadein{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:440px){
  body{padding:12px 6px 24px}
  .stage-head{padding:0 6px}
}

let searchQ='';
function searchScreen(){
  const q=searchQ.trim().toLowerCase();
  const results = q? IT.filter(i=>i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q)) : [];
  const suggestions=['Drill','Passport','Tent','Chargers','Ornaments'];
  let body;
  if(!q){
    body=`<div class="divider-lbl">SUGGESTED</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${suggestions.map(s=>`<span class="chip" style="cursor:pointer;padding:9px 14px;font-size:14px" onclick="setSearch('${s}')">${s}</span>`).join('')}</div>
      <div class="divider-lbl" style="margin-top:22px">BROWSE BY CATEGORY</div>
      <div class="list">${Object.keys(CAT).map(cat=>{const n=IT.filter(i=>i.cat===cat).length;
        return `<div class="row" onclick="setSearch('${cat}')">${thumb(CAT[cat],'')}
        <div class="tx"><b>${cat}</b><span>${n} item${n!==1?'s':''}</span></div><span class="chev">${I.chev}</span></div>`;}).join('')}</div>`;
  } else if(results.length){
    body=`<div class="divider-lbl">${results.length} RESULT${results.length!==1?'S':''}</div>
      <div class="list">${results.map(it=>{const c=CT[it.ct];const l=LOC[c.loc];
        return `<div class="row" onclick="openItem('${it.id}')">${thumb(CAT[it.cat],it.emoji,'sm')}
        <div class="tx"><b>${hi(it.name,q)}</b><span>${I.pin}${c.name} · ${l.name}</span></div>
        <span class="trail">${it.qty>1?'×'+it.qty:''}</span><span class="chev">${I.chev}</span></div>`;}).join('')}</div>`;
  } else {
    body=`<div class="empty"><div class="ic">${I.search}</div><h3>No matches</h3><p>Nothing found for "${searchQ}". Try another word or browse by category.</p></div>`;
  }
  return `${statusbar()}
  <div class="view pad pad-b fadein">
    <div class="h1" style="margin-top:6px">Search</div>
    <div class="search" style="margin:12px 0 8px">${I.search}
      <input id="searchInput" placeholder="Find any item — 'where is my…'" value="${searchQ.replace(/"/g,'&quot;')}" oninput="onSearch(this.value)" autocomplete="off">
      ${q?`<button style="background:none;border:none;color:var(--text-3);cursor:pointer" onclick="setSearch('')">${I.x}</button>`:''}
    </div>
    ${body}
  </div>
  ${tabbar('search')}`;
}
function hi(text,q){const i=text.toLowerCase().indexOf(q);if(i<0)return text;
  return text.slice(0,i)+'<mark style="background:'+ 'var(--primary-050)' +';color:var(--primary);border-radius:3px;padding:0 2px">'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);}
function onSearch(v){searchQ=v;const inp=document.getElementById('searchInput');const pos=inp?inp.selectionStart:0;
  render();const ni=document.getElementById('searchInput');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}}
function setSearch(v){searchQ=v;state.tab='search';render();const ni=document.getElementById('searchInput');if(ni)ni.focus();}

/* ============================================================
   ROUTER
   ============================================================ */
function screenFor(){
  switch(state.tab){
    case 'home': return homeScreen();
    case 'browse': return browseScreen();
    case 'location': return locationScreen();
    case 'container': return containerScreen();
    case 'item': return itemScreen();
    case 'search': return searchScreen();
    case 'add': return addScreen();
    case 'pair': return pairScreen();
    case 'profile': return profileScreen();
    case 'scan': return scanScreen();
    case 'scanSuccess': return scanSuccessScreen(state.scanId);
    default: return homeScreen();
  }
}
function render(){el.innerHTML=screenFor();const v=el.querySelector('.view');if(v&&state._scrollTop)v.scrollTop=0;}
function go(tab){state.tab=tab;if(tab!=='search')searchQ=searchQ;render();}
function back(){go(state.prevTab||'browse');}
function openContainer(id){state.prevTab='browse';state.ctId=id;state.tab='container';render();}
function openLocation(id){state.locId=id;state.tab='location';render();}
function openItem(id){state.itemId=id;state.tab='item';render();}
function openAdd(ct){addCt=ct||null;state.tab='add';render();}
function saveItem(){toast('Item added');state.tab=state.ctId?'container':'home';render();}
function openScan(){state.tab='scan';render();}
function closeScan(){go(state.lastTab||'home');}
function scanSuccess(id){state.scanId=id;state.tab='scanSuccess';render();}
function scanUnknown(){state.tab='pair';render();}

/* theme */
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('themeBtn').innerHTML=(state.theme==='dark'?I.sun+' Light':I.moon+' Dark');}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();render();}

/* toast */
function toast(msg){
  let t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(30,30,34,.92);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fade .2s';
  el.appendChild(t);setTimeout(()=>t.remove(),1400);
}

const SCREENS=[['home','Home'],['browse','Browse'],['location','Location detail'],['container','Container detail'],['item','Item detail'],['search','Search'],['add','Add item'],['pair','Pair new tag'],['profile','Profile'],['scan','Scan (NFC)'],['scanSuccess','Scan · success']];
document.getElementById('jumpBtn').onclick=()=>{
  const names=SCREENS.map((s,i)=>`${i+1}. ${s[1]}`).join('\n');
  const pick=prompt('Jump to screen (1–'+SCREENS.length+'):\n\n'+names,'1');
  if(!pick)return;const idx=parseInt(pick,10)-1;if(idx<0||idx>=SCREENS.length)return;
  const id=SCREENS[idx][0];
  if(id==='location')state.locId='garage';
  if(id==='container')state.ctId=state.ctId||'c2';
  if(id==='item')state.itemId=state.itemId||'i1';
  if(id==='scanSuccess')state.scanId='c2';
  if(id==='add')addCt='c2';
  state.tab=id;render();
};
document.getElementById('themeBtn').onclick=toggleTheme;

/* track last top-level tab for scan close */
const _go=go;go=function(t){if(['home','browse','search','profile'].includes(t))state.lastTab=t;_go(t);};

/* init */
applyTheme();render();
