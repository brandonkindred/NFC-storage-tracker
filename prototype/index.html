<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TagBin — NFC Storage Tracker · UI Prototype</title>
<style>
/* ============================================================
   TagBin — NFC Storage Tracker
   High-fidelity, self-contained mobile UI prototype
   Design tokens ▸ light + dark themes below
   Built to WCAG 2.2 AA: semantic HTML, keyboard, focus,
   contrast, ARIA, reduced-motion, rem-based text scaling.
   ============================================================ */
:root{
  /* accent */
  --primary:#4F46E5; --primary-600:#4338CA; --primary-050:#EEF0FE;
  --accent:#7C3AED; --grad:linear-gradient(135deg,#5B5BF0,#8B5CF6);
  --grad-warm:linear-gradient(135deg,#4F46E5,#7C3AED); /* darkened for AA text contrast */
  --success:#34C759; --warning:#FF9F0A; --danger:#D70015; --info:#0A84FF; /* danger ≥4.5:1 on bg+surface */
  --focus:#0A66FF;
  /* surfaces (light) */
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#FFFFFF; --raised:#FFFFFF;
  --fill:#7676801F; --fill-2:#78788028;
  --text:#111114; --text-2:#585863; --text-3:#6A6A72; /* text-2/3 darkened → ≥4.5:1 */
  --separator:rgba(60,60,67,.12); --sep-strong:rgba(60,60,67,.22);
  --shadow:0 1px 2px rgba(17,17,20,.06),0 8px 24px rgba(17,17,20,.08);
  --shadow-lg:0 12px 40px rgba(17,17,20,.16);
  --tabbar:rgba(255,255,255,.86);
  --nav:rgba(242,242,247,.8);
  /* shape + type */
  --r-sm:10px; --r:16px; --r-lg:22px; --r-xl:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --primary:#8C8CF7; --primary-600:#7E7EF2; --primary-050:#23233E;
  --accent:#B79BFB; --grad:linear-gradient(135deg,#6D6DF2,#9B7BF6);
  --grad-warm:linear-gradient(135deg,#5B54E6,#7C3AED);
  --danger:#FF453A; /* ≥4.5:1 on dark surfaces */
  --focus:#5AA2FF;
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --raised:#1C1C1E;
  --fill:#7676803D; --fill-2:#7878805C;
  --text:#FFFFFF; --text-2:#B6B6BE; --text-3:#9A9AA3; /* lightened → ≥4.5:1 on dark */
  --separator:rgba(84,84,88,.42); --sep-strong:rgba(84,84,88,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  --tabbar:rgba(28,28,30,.8);
  --nav:rgba(20,20,22,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:
    radial-gradient(1100px 700px at 15% -10%, #E9E8FF 0%, transparent 55%),
    radial-gradient(1000px 700px at 100% 0%, #F3E8FF 0%, transparent 50%),
    #EDECF3;
  color:#1c1c1e; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 16px 48px; gap:22px;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(1100px 700px at 15% -10%, #16162b 0%, transparent 55%),
    radial-gradient(1000px 700px at 100% 0%, #1c1230 0%, transparent 50%),
    #08080c;
  color:#fff;
}
/* accessibility helpers */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:where(a,button,[role="button"],[role="radio"],[role="switch"],[role="link"],input,[tabindex]):focus-visible{
  outline:3px solid var(--focus); outline-offset:2px; border-radius:10px;
}
/* double ring for controls that sit on gradients / dark overlays */
.scan-cta:focus-visible,.hero .circ:focus-visible,.scan-screen .simbtn:focus-visible,
.scan-screen .top button:focus-visible,.tab:focus-visible,.fab:focus-visible,.ccard:focus-visible{
  outline:3px solid #fff; outline-offset:2px; box-shadow:0 0 0 6px var(--focus);
}
/* ---------- stage chrome ---------- */
.stage-head{width:100%;max-width:920px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:11px}
.brandmark .logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(91,91,240,.4)}
.brandmark .logo svg{width:22px;height:22px}
.brandmark b{font-size:1.1875rem;letter-spacing:-.4px}
.brandmark span{display:block;font-size:.75rem;color:#4a4a52;font-weight:500;margin-top:1px}
:root[data-theme="dark"] .brandmark span{color:#b9b9c2}
.stage-head .spacer{flex:1}
.ctrl{border:1px solid var(--sep-strong);background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
  color:#1c1c22;font-family:var(--font);font-size:.8125rem;font-weight:600;
  padding:9px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  gap:7px;transition:.15s;min-height:44px}
:root[data-theme="dark"] .ctrl{background:rgba(40,40,46,.7);color:#f2f2f6}
.ctrl:hover{transform:translateY(-1px)}
.ctrl svg{width:15px;height:15px}
.ctrl.round{padding:0;width:44px}
.hint{width:100%;max-width:920px;font-size:.78125rem;color:#4a4a52;text-align:center;margin-top:-8px}
:root[data-theme="dark"] .hint{color:#b3b3bd}
.hint kbd{font-family:var(--font);font-weight:700}
/* ---------- device ---------- */
.device{
  width:390px;max-width:calc(100vw - 24px);
  height:844px;max-height:calc(100vh - 40px);
  min-height:640px;
  background:#0b0b0d;border-radius:54px;padding:13px;
  box-shadow:var(--shadow-lg),0 0 0 2px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.06);
  position:relative;flex:none;
}
.screen{
  position:relative;width:100%;height:100%;background:var(--bg);color:var(--text);
  border-radius:42px;overflow:hidden;display:flex;flex-direction:column;
}
.screen-root:focus{outline:none}
/* status bar (decorative) */
.statusbar{height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 8px;font-size:.9375rem;font-weight:600;color:var(--text);position:relative;z-index:5}
.statusbar .r{display:flex;align-items:center;gap:6px}
.statusbar .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:118px;height:33px;background:#000;border-radius:20px}
/* scroll body */
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view::-webkit-scrollbar{width:0}
.pad{padding:0 20px}
.pad-b{padding-bottom:110px}
/* nav bar */
.nav{position:sticky;top:0;z-index:4;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--separator);padding:6px 12px 10px;display:flex;align-items:center;gap:6px}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--primary);font-size:1rem;font-weight:500;
  background:none;border:none;cursor:pointer;padding:6px 8px;font-family:var(--font);min-height:44px}
.nav .back svg{width:19px;height:19px}
.nav .title{flex:1;text-align:center;font-size:1rem;font-weight:650;letter-spacing:-.2px;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .act{color:var(--primary);font-size:1rem;font-weight:500;background:none;border:none;cursor:pointer;
  padding:6px 8px;font-family:var(--font);display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
.nav .act svg{width:22px;height:22px}
.nav .side{min-width:64px;display:flex;align-items:center}
.nav .side.r{justify-content:flex-end}
/* typography */
h1,h2,h3{font-weight:750}
.h1{font-size:2.0625rem;font-weight:800;letter-spacing:-.9px;line-height:1.05;margin:6px 0 2px;overflow-wrap:anywhere}
.h2{font-size:1.375rem;font-weight:750;letter-spacing:-.5px;margin:20px 0 10px}
.sub{color:var(--text-2);font-size:.9375rem}
.eyebrow{font-size:.78125rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.section-head h2,.section-head h3{font-size:1.125rem;font-weight:750;letter-spacing:-.3px;margin:0}
.link{background:none;border:none;color:var(--primary);font-family:var(--font);font-size:.90625rem;font-weight:600;
  cursor:pointer;padding:8px 6px;min-height:44px;display:inline-flex;align-items:center;gap:4px;border-radius:10px}
.link svg{width:20px;height:20px}
/* cards / lists */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:13px;padding:13px 15px;width:100%;text-align:left;
  border:none;border-bottom:.5px solid var(--separator);font-family:var(--font);
  cursor:pointer;transition:background .12s;color:inherit;text-decoration:none;background:transparent}
.row:last-child{border-bottom:none}
.row:active{background:var(--fill)}
.row.static{cursor:default}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:1rem;font-weight:600;letter-spacing:-.2px;overflow:hidden;
  text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .tx span{display:block;font-size:.84375rem;color:var(--text-2);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .tx span svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.row .chev{color:var(--text-3);flex:none}
.row .chev svg{width:16px;height:16px;display:block}
.row .trail{font-size:.9375rem;color:var(--text-2);flex:none}
/* thumb / avatar */
.thumb{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:1.375rem;
  color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.thumb.lg{width:58px;height:58px;border-radius:15px;font-size:1.6875rem}
.thumb.sm{width:38px;height:38px;border-radius:10px;font-size:1.125rem}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:.78125rem;
  font-weight:600;background:var(--fill);color:var(--text-2)}
.chip svg{width:13px;height:13px}
.chip.tint{background:var(--primary-050);color:var(--primary)}
.chip .dot{width:9px;height:9px;border-radius:3px;flex:none}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:4px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 13px;box-shadow:var(--shadow);min-width:0}
.stat .l{overflow-wrap:anywhere}
.stat .n{font-size:1.625rem;font-weight:800;letter-spacing:-.6px;line-height:1}
.stat .l{font-size:.75rem;color:var(--text-2);margin-top:5px;font-weight:600}
.stat .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-bottom:9px;color:#fff}
.stat .ic svg{width:15px;height:15px}
/* search field */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:12px;
  color:var(--text-2);font-size:1rem;cursor:text;width:100%;border:none;font-family:var(--font);text-align:left;min-height:46px}
.search svg{width:18px;height:18px;flex:none}
.search .ph{color:var(--text-2)}
.search input{border:none;background:none;outline:none;font-family:var(--font);font-size:1rem;color:var(--text);width:100%}
.search input::placeholder{color:var(--text-2)}
.search .clear{background:none;border:none;color:var(--text-2);cursor:pointer;padding:6px;min-width:44px;min-height:44px;margin:-6px -8px -6px -4px;display:grid;place-items:center}
/* first-run hint */
.coach{display:flex;gap:11px;align-items:flex-start;background:var(--primary-050);border:1px solid var(--sep-strong);
  border-radius:var(--r);padding:13px 14px;margin-top:14px}
.coach .ci{width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.coach .ci svg{width:17px;height:17px}
.coach .ct{flex:1;font-size:.84375rem;color:var(--text);line-height:1.35}
.coach .ct b{font-weight:700}
.coach .cx{background:none;border:none;color:var(--text-2);cursor:pointer;padding:4px;min-width:44px;min-height:44px;margin:-9px -10px -9px 0;display:grid;place-items:center;flex:none}
.coach .cx svg{width:16px;height:16px}
/* big scan cta */
.scan-cta{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;color:#fff;width:100%;
  text-align:left;border:none;font-family:var(--font);display:block;
  background:var(--grad-warm);box-shadow:0 14px 34px rgba(79,70,229,.42);cursor:pointer;margin-top:16px}
.scan-cta .rings{position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.4}
.scan-cta h2{margin:0;font-size:1.25rem;font-weight:750;letter-spacing:-.3px;color:#fff}
.scan-cta p{margin:4px 0 0;font-size:.875rem;color:#fff;max-width:210px}
.scan-cta .go{margin-top:15px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.24);
  backdrop-filter:blur(6px);padding:10px 16px;border-radius:999px;font-weight:650;font-size:.875rem}
.scan-cta .go svg{width:17px;height:17px}
/* container cards (horizontal) */
.hscroll{display:flex;gap:13px;overflow-x:auto;padding:2px 20px 8px;margin:0 -20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ccard{flex:none;width:158px;background:var(--surface);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;border:none;padding:0;text-align:left;font-family:var(--font);color:inherit;display:block}
.ccard .top{height:96px;display:grid;place-items:center;font-size:2.5rem;position:relative;color:#fff}
.ccard .top .tag{position:absolute;top:9px;right:9px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  border-radius:999px;padding:4px 8px;font-size:.6875rem;font-weight:700;display:flex;align-items:center;gap:4px}
.ccard .top .tag svg{width:11px;height:11px}
.ccard .bot{padding:11px 13px 13px}
.ccard .bot b{font-size:.9375rem;font-weight:650;letter-spacing:-.2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .bot span{font-size:.78125rem;color:var(--text-2);display:flex;align-items:center;gap:4px;margin-top:3px}
.ccard .bot span svg{width:12px;height:12px}
/* grid of containers */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.gcard{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
  border:none;padding:0;text-align:left;font-family:var(--font);color:inherit;display:block;width:100%}
.gcard .top{height:88px;display:grid;place-items:center;font-size:2.375rem;color:#fff;position:relative}
.gcard .top .tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);border-radius:999px;padding:3px 7px;font-size:.625rem;font-weight:700;display:flex;align-items:center;gap:3px}
.gcard .top .tag svg{width:10px;height:10px}
.gcard .bot{padding:10px 12px 12px}
.gcard .bot b{font-size:.90625rem;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .bot span{font-size:.75rem;color:var(--text-2);margin-top:2px;display:block}
/* activity feed */
.feed{display:flex;flex-direction:column;gap:2px}
.fitem{display:flex;gap:12px;align-items:center;padding:11px 4px}
.fitem .fic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.fitem .fic svg{width:17px;height:17px}
.fitem .ftx{flex:1;min-width:0}
.fitem .ftx p{margin:0;font-size:.90625rem;line-height:1.3}
.fitem .ftx p b{font-weight:650}
.fitem .ftx time{font-size:.75rem;color:var(--text-2)}
/* hero (container detail) */
.hero{height:186px;position:relative;display:grid;place-items:center;color:#fff}
.hero .emoji{font-size:4.625rem;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.4))}
.hero .float-nav{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;z-index:2}
.hero .circ{width:44px;height:44px;border-radius:999px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  display:grid;place-items:center;color:#fff;border:none;cursor:pointer}
.hero .circ svg{width:20px;height:20px}
.hero .info{position:absolute;left:20px;right:20px;bottom:16px;z-index:2}
.hero .info h1{margin:0;font-size:1.6875rem;font-weight:800;letter-spacing:-.6px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.hero .info .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hero .info .meta .chip{background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px)}
/* item detail */
.item-hero{height:220px;display:grid;place-items:center;font-size:6rem;color:#fff;position:relative}
.qty{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:999px;box-shadow:var(--shadow)}
.qty button{width:44px;height:44px;border:none;background:none;color:var(--primary);font-size:1.375rem;cursor:pointer;font-family:var(--font)}
.qty b{min-width:34px;text-align:center;font-size:1.0625rem;font-weight:700}
/* meta rows (key/value) */
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:.5px solid var(--separator);font-size:.96875rem}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600;display:flex;align-items:center;gap:7px;text-align:right}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:15px;
  font-size:1.03125rem;font-weight:650;border:none;cursor:pointer;font-family:var(--font);transition:.15s;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 22px rgba(79,70,229,.34)}
:root[data-theme="dark"] .btn.primary{color:#0a0a12}
.btn.primary:active{transform:scale(.985)}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger)}
.btn-row{display:flex;gap:11px}
.btn-row .btn{flex:1}
/* FAB */
.fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:19px;background:var(--primary);
  color:#fff;border:none;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 26px rgba(79,70,229,.5);z-index:6;transition:.15s}
:root[data-theme="dark"] .fab{color:#0a0a12}
.fab:active{transform:scale(.94)}
.fab svg{width:27px;height:27px}
/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;padding-bottom:20px;
  background:var(--tabbar);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--separator);
  display:flex;align-items:flex-start;padding-top:8px;z-index:7}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-2);min-height:56px;
  background:none;border:none;cursor:pointer;font-family:var(--font);font-size:.6875rem;font-weight:600}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--primary)}
.tab.scan-tab{position:relative}
.tab.scan-tab .btn-scan{width:54px;height:54px;border-radius:18px;background:var(--grad);margin-top:-22px;
  display:grid;place-items:center;box-shadow:0 10px 24px rgba(91,91,240,.5)}
.tab.scan-tab .btn-scan svg{width:26px;height:26px;color:#fff}
.tab.scan-tab span{margin-top:2px}
/* scan overlay screen */
.scan-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;color:#fff;
  background:radial-gradient(120% 90% at 50% 18%, #4b40b8 0%, #2b2350 55%, #14111f 100%)}
:root[data-theme="dark"] .scan-screen{background:radial-gradient(120% 90% at 50% 18%, #3a3196 0%, #1c1740 55%, #05040a 100%)}
.scan-screen .top{display:flex;justify-content:flex-end;padding:52px 18px 0}
.scan-screen .top button{background:rgba(255,255,255,.2);border:none;color:#fff;width:44px;height:44px;
  border-radius:999px;display:grid;place-items:center;cursor:pointer}
.scan-screen .top button svg{width:20px;height:20px}
.scan-screen .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
.pulse{position:relative;width:180px;height:180px;display:grid;place-items:center;margin-bottom:34px}
.pulse .ring{position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,255,255,.55);animation:pulse 2.4s ease-out infinite}
.pulse .ring:nth-child(2){animation-delay:.8s}
.pulse .ring:nth-child(3){animation-delay:1.6s}

.pulse .core{width:96px;height:96px;border-radius:30px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.pulse .core svg{width:46px;height:46px;color:#fff}
.scan-screen h1{font-size:1.5rem;font-weight:750;margin:0 0 8px;letter-spacing:-.4px;color:#fff}
.scan-screen p{font-size:.9375rem;color:rgba(255,255,255,.92);margin:0;max-width:250px;line-height:1.4}
.scan-screen .foot{padding:0 24px 44px;display:flex;flex-direction:column;gap:10px}
.scan-screen .simbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;

.scan-screen .simbtn b{font-weight:750}
.scan-screen .simbtn.solid{background:#fff;color:#241d52;border:none;font-weight:700}
.check{width:104px;height:104px;border-radius:999px;background:var(--success);display:grid;place-items:center;
  margin-bottom:26px;box-shadow:0 12px 34px rgba(52,199,89,.5);animation:pop .4s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.check svg{width:56px;height:56px;color:#fff}
/* sheet (add item / pair) */
.sheet-scr{position:absolute;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;
  animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grabber{height:5px;width:38px;border-radius:999px;background:var(--sep-strong);margin:9px auto 0}
.field{margin-bottom:16px}
.field label,.field .flabel{display:block;font-size:.8125rem;font-weight:650;color:var(--text-2);margin:0 0 7px 3px;letter-spacing:-.1px}
.input{width:100%;background:var(--surface);border:.5px solid var(--sep-strong);border-radius:13px;padding:14px 15px;
  font-size:1rem;font-family:var(--font);color:var(--text);outline:none}
button.input{text-align:left;cursor:pointer;min-height:52px}
.input.tap{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.input.tap .ph{color:var(--text-2)}
.input.tap .val{display:flex;align-items:center;gap:9px;font-weight:500}
.input.tap svg{width:16px;height:16px;color:var(--text-2)}
.qtyfield{display:flex;justify-content:space-between;align-items:center}
.photo-drop{width:100%;height:120px;border-radius:15px;border:2px dashed var(--sep-strong);display:flex;flex-direction:column;

.photo-drop svg{width:26px;height:26px}
.photo-drop span{font-size:.8125rem;font-weight:600}
.pick-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:2px}

.prof-head>div{min-width:0}

.prof-head span{color:var(--text-2);font-size:.875rem;overflow-wrap:anywhere}
.switch-btn{background:none;border:none;padding:0;margin:0;cursor:pointer;display:inline-flex;align-items:center;
  min-width:51px;min-height:44px;flex:none}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--fill-2);position:relative;transition:.2s;pointer-events:none}
.switch-btn[aria-checked="true"] .toggle{background:var(--success)}
.toggle .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.switch-btn[aria-checked="true"] .knob{left:22px}
.mini-ic{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.mini-ic svg{width:16px;height:16px}
/* misc */
.divider-lbl{font-size:.78125rem;color:var(--text-2);font-weight:600;margin:16px 4px 8px;letter-spacing:.2px}
.notes{background:var(--surface);border-radius:var(--r);padding:15px;font-size:.90625rem;color:var(--text);line-height:1.5;box-shadow:var(--shadow)}
.fadein{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(28,28,32,.95);color:#fff;

@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto!important}

  .pulse .ring:nth-child(3){transform:scale(.56)}
}
@media (max-width:440px){

// meaningful emoji tile → labeled image; decorative → hidden
function thumb(bg,emoji,cls='',label){
  const a = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
  return `<span class="thumb ${cls}" style="background:${bg}" ${a}>${emoji}</span>`;
}
function catDot(cat){return `<span class="dot" style="background:${CAT[cat]}"></span>`;}

function adjItemQty(id,d){const it=IT.find(x=>x.id===id);if(!it)return;it.qty=Math.max(1,it.qty+d);
  render(false);announce('Quantity '+it.qty);const b=el.querySelector('.qty [data-act="'+(d<0?'dec':'inc')+'"]');if(b)b.focus();}

/* ---------------- SEARCH ---------------- */
function itemRow(it,q){const c=CT[it.ct];const l=LOC[c.loc];
  return `<button class="row" onclick="openItem('${it.id}','search')" aria-label="${esc(it.name)}, in ${esc(c.name)}, ${esc(l.name)}">${thumb(CAT[it.cat],it.emoji,'sm')}
    <span class="tx"><b>${q?hi(it.name,q):esc(it.name)}</b><span>${I.pin}${esc(c.name)} · ${l.name}</span></span>
    <span class="trail" aria-hidden="true">${it.qty>1?'×'+it.qty:''}</span><span class="chev">${I.chev}</span></button>`;}
/* strip natural-language lead-ins the placeholder invites ("where is my drill" → "drill") */
function normQ(s){return s.toLowerCase()
  .replace(/^\s*(where(?:'s|\s+is|\s+are)?|find|locate)\s+/,'')
  .replace(/^(my|the|our|a|an)\s+/,'')
  .replace(/[?!.\s]+$/,'').trim();}
function searchScreen(){
  const q=normQ(searchQ);
  const scope=state.searchScope?CT[state.searchScope]:null;
  const base=scope?itemsIn(scope.id):IT;
  const results = q ? base.filter(i=>i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q)) : (scope?base:[]);
  const suggestions=['Drill','Passport','Tent','Chargers','Ornaments'];
  let body;
  if(scope && !q){
    body = base.length
      ? `<h2 class="divider-lbl">${base.length} ITEM${base.length!==1?'S':''} IN THIS BIN</h2><div class="list">${base.map(it=>itemRow(it,'')).join('')}</div>`
      : `<div class="empty"><div class="ic">${I.box}</div><h2>This bin is empty</h2><p>${esc(scope.name)} has no items to search yet.</p></div>`;
  } else if(!q){
    body=`<h2 class="divider-lbl">SUGGESTED</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${suggestions.map(s=>`<button class="chip" style="padding:10px 14px;font-size:.875rem;border:none;cursor:pointer" onclick="setSearch('${s}')">${s}</button>`).join('')}</div>
      <h2 class="divider-lbl" style="margin-top:22px">BROWSE BY CATEGORY</h2>
      <div class="list">${Object.keys(CAT).map(cat=>{const n=IT.filter(i=>i.cat===cat).length;
        return `<button class="row" onclick="setSearch('${cat}')">${thumb(CAT[cat],CAT_EMOJI[cat],'',cat)}
        <span class="tx"><b>${cat}</b><span>${n} item${n!==1?'s':''}</span></span><span class="chev">${I.chev}</span></button>`;}).join('')}</div>`;
  } else if(results.length){
    body=`<h2 class="divider-lbl">${results.length} RESULT${results.length!==1?'S':''}</h2>
      <div class="list">${results.map(it=>itemRow(it,q)).join('')}</div>`;
  } else {
    body=`<div class="empty"><div class="ic">${I.search}</div><h2>No matches</h2><p>Nothing found for “${esc(searchQ)}”${scope?' in '+esc(scope.name):''}. Try another word${scope?' or search all bins':' or browse by category'}.</p></div>`;
  }
  const scopeChip = scope ? `<button class="chip" style="margin:0 0 12px;border:none;cursor:pointer" onclick="clearScope()" aria-label="Clear bin filter, search all items">${I.x}Searching in ${esc(scope.name)}</button>` : '';
  const scopeBack = scope ? `<button class="link" style="padding-left:0;margin-top:4px" onclick="returnTo('container')">${I.back}${esc(scope.name)}</button>` : '';
  return `${statusbar()}
  <main class="view pad pad-b fadein screen-root" tabindex="-1" aria-label="${scope?'Search '+esc(scope.name):'Search'}">
    ${scopeBack}
    <h1 class="h1" style="margin-top:${scope?'0':'6px'}">Search</h1>
    <div class="search" style="margin:12px 0 8px" role="search">${I.search}
      <label class="sr-only" for="searchInput">${scope?'Search '+esc(scope.name):'Search all items'}</label>
      <input id="searchInput" placeholder="${scope?'Search this bin…':"Find any item — 'where is my…'"}" value="${esc(searchQ)}" oninput="onSearch(this.value)" autocomplete="off">
      ${q?`<button class="clear" onclick="setSearch('')" aria-label="Clear search">${I.x}</button>`:''}
    </div>
    ${scopeChip}
    ${body}
  </main>
  ${tabbar('search')}`;
}
function hi(text,q){const i=text.toLowerCase().indexOf(q);if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark style="background:var(--primary-050);color:var(--primary);border-radius:3px;padding:0 2px">'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));}
function announceCount(){const q=normQ(searchQ);if(!q)return;
  const n=searchBase().filter(i=>i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q)).length;
  announce(n+' result'+(n!==1?'s':''));}
let composing=false; /* don't re-render mid-IME-composition — it would kill the composition */
function onSearch(v){searchQ=v;if(composing)return;
  const inp=document.getElementById('searchInput');const pos=inp?inp.selectionStart:0;
  render(false);const ni=document.getElementById('searchInput');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}
  announceCount();}
function setSearch(v){searchQ=v;state.tab='search';render(false);const ni=document.getElementById('searchInput');if(ni)ni.focus();announceCount();}

const COVER_COLS=['#6366F1','#B45309','#EF4444','#3B82F6','#10B981','#EC4899','#8B5CF6','#14B8A6','#64748B','#E05A0E','#A855F7','#0284C7'];

function nextPairUid(){pairSeq++;return '04:D9:'+((0x33+pairSeq)%256).toString(16).toUpperCase().padStart(2,'0')+':'+((0x1A+pairSeq*47)%256).toString(16).toUpperCase().padStart(2,'0');}

function pickCover(i){pairCover=i;render(false);const r=el.querySelector('[aria-labelledby="coverLbl"] [aria-checked="true"]');if(r)r.focus();}
function coverKey(e){const keys=['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'];if(!keys.includes(e.key))return;e.preventDefault();
  const n=COVERS.length;let i=(e.key==='ArrowRight'||e.key==='ArrowDown')?(pairCover+1)%n:(pairCover-1+n)%n;pickCover(i);}

/* ============================================================
   ROUTER
   ============================================================ */
function screenFor(){
  switch(state.tab){
    case 'home': return homeScreen();
    case 'browse': return browseScreen();
    case 'location': return locationScreen();
    case 'container': return containerScreen();
    case 'item': return itemScreen();
    case 'search': return searchScreen();
    case 'add': return addScreen();
    case 'pair': return pairScreen();
    case 'profile': return profileScreen();
    case 'scan': return scanScreen();
    case 'scanSuccess': return scanSuccessScreen(state.scanId);
    default: return homeScreen();
  }
}
const MODAL_TABS=['add','pair','scan','scanSuccess'];
const isModal=()=>MODAL_TABS.includes(state.tab);
function render(nav){
  el.innerHTML=screenFor();
  /* while a modal screen is up, the stage chrome is inert so focus can't escape the dialog */
  document.querySelectorAll('.stage-head,.hint').forEach(n=>{isModal()?n.setAttribute('inert',''):n.removeAttribute('inert');});
  const root=el.querySelector('.screen-root');
  if(nav){const v=el.querySelector('.view');if(v)v.scrollTop=0;if(root)root.focus({preventScroll:true});}
}
function go(tab){if(tab==='search')state.searchScope=null;if(['home','browse','search','profile'].includes(tab))state.lastTab=tab;state.tab=tab;render(true);}
/* navigate back without side effects (keeps searchScope, unlike go()) */
function returnTo(route){if(['home','browse','search','profile'].includes(route))state.lastTab=route;state.tab=route;render(true);}
function back(){returnTo(state.ctFrom||'browse');}
function openContainer(id,from){state.ctFrom=from||state.tab;state.ctId=id;state.tab='container';render(true);}
function openLocation(id){state.locId=id;state.tab='location';render(true);}
function openItem(id,from){state.itemFrom=from||state.tab;state.itemId=id;state.tab='item';render(true);}
function itemBack(){if(state.itemFrom==='search'){returnTo('search');}else{state.tab='container';render(true);}}
/* "Located in" from an item: never record the item as the container's parent
   (that made Back loop item↔container). Restore the container's own chain, or
   inherit the search origin when the item came from search results. */
function openBinFromItem(id){
  if(state.itemFrom==='search'){openContainer(id,'search');}
  else if(state.ctId===id){state.tab='container';render(true);}
  else openContainer(id,'browse');
}
function openAdd(ct){addCt=ct||null;addQty=1;addCat='Tools';addName='';addNotes='';addBinOpen=false;state.tab='add';render(true);}
function cancelAdd(){
  if(addCt){state.ctId=addCt;state.ctFrom=state.ctFrom||'browse';state.tab='container';}
  else state.tab='home';
  render(true);
}
function openBinSearch(id){state.searchScope=id;searchQ='';state.tab='search';render(true);const ni=el.querySelector('#searchInput');if(ni)ni.focus();}
function clearScope(){state.searchScope=null;render(false);const ni=el.querySelector('#searchInput');if(ni)ni.focus();}
function searchBase(){return state.searchScope?itemsIn(state.searchScope):IT;}
function saveItem(){
  const name=addName.trim();
  if(!name){toast('Give your item a name first');const f=el.querySelector('#itemName');if(f)f.focus();return;}
  const ct=addCt||state.ctId;
  if(!ct){toast('Choose a bin for this item');return;}
  const added=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  IT.push({id:'i'+(IT.length+1),name,emoji:CAT_EMOJI[addCat]||'📦',cat:addCat,qty:addQty,ct,note:addNotes.trim(),added});
  ACT.unshift({ic:'➕',color:'#2FA14C',act:'add',html:`Added <b>${esc(name)}</b> to ${esc(CT[ct].name)}`,t:'Just now'});
  state.ctId=ct;state.tab='container';render(true);
  toast('Added '+name);
}
function openScan(){
  state.scanFrom = ['home','browse','search','profile','location','container'].includes(state.tab)?state.tab:'home';
  state.tab='scan';render(true);
}
/* cancel restores exactly where scanning began — incl. the container for a re-scan */
function closeScan(){
  if(state.scanFrom==='container'){state.tab='container';render(true);}
  else returnTo(state.scanFrom||'home');
}
/* open a scan result with a sensible back-origin: a re-scan of the same bin keeps its
   existing chain; a different bin from a re-scan falls back to browse */
function openScannedBin(id){
  const from = state.scanFrom==='container' ? (state.ctId===id?state.ctFrom:'browse') : (state.scanFrom||'home');
  openContainer(id,from);
}
function cancelPair(){closeScan();}
function scanSuccess(id){state.scanId=id;state.tab='scanSuccess';render(true);}
function scanUnknown(){pairName='';pairLoc=null;pairCover=0;pairUid=nextPairUid();state.tab='pair';render(true);}
function demo(){toast('Demo only — not wired in this prototype');}

/* theme */
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme);
  const b=document.getElementById('themeBtn');
  b.innerHTML=(state.theme==='dark'?I.sun+' Light mode':I.moon+' Dark mode');
  b.setAttribute('aria-label',state.theme==='dark'?'Switch to light mode':'Switch to dark mode');}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();render(false);
  const s=el.querySelector('#darkSwitch');if(s)s.focus();}

/* live-region announce + toast */
function announce(m){const n=document.getElementById('live');n.textContent='';setTimeout(()=>{n.textContent=m;},30);}
function toast(msg){
  /* clear-then-set so ATs re-announce an identical repeated message */
  const a=document.getElementById('alert');a.textContent='';setTimeout(()=>{a.textContent=msg;},30);
  /* host on .device (position:relative), outside #screen — survives render()'s innerHTML wipe */
  const host=el.parentElement||el;
  host.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  host.appendChild(t);setTimeout(()=>t.remove(),1800);
}

/* IME composition: delegated on the container so listeners survive re-renders */
el.addEventListener('compositionstart',e=>{if(e.target.id==='searchInput')composing=true;});
el.addEventListener('compositionend',e=>{if(e.target.id==='searchInput'){composing=false;onSearch(e.target.value);}});

/* keyboard activation for composite role=button elements (cards/rows/cta) */
el.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    const b=e.target.closest('[role="button"]');
    if(b&&el.contains(b)){e.preventDefault();b.click();}
  }
});

/* modal dialogs: trap Tab focus inside the screen, Escape closes */
document.addEventListener('keydown',e=>{
  if(!isModal())return;
  if(e.key==='Escape'){e.preventDefault();
    if(state.tab==='add'&&addBinOpen){toggleBinPicker();return;} /* collapse the listbox first */
    if(state.tab==='add')cancelAdd();
    else if(state.tab==='pair')cancelPair();
    else closeScan();
    return;}
  if(e.key!=='Tab')return;
  const f=[...el.querySelectorAll('button,input,select,textarea,[tabindex]')]
    .filter(x=>!x.disabled&&x.tabIndex>=0&&x.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1],a=document.activeElement;
  if(e.shiftKey&&(a===first||!el.contains(a))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(a===last||!el.contains(a))){e.preventDefault();first.focus();}
});

/* screen jump menu (prototype dev aid) */
const SCREENS=[['home','Home'],['browse','Browse'],['location','Location detail'],['container','Container detail'],['item','Item detail'],['search','Search'],['add','Add item'],['pair','Pair new tag'],['profile','Profile'],['scan','Scan (NFC)'],['scanSuccess','Scan · success']];
/* jump through the real navigation initializers so every route's dependent
   state (ctId, origins, form fields) is valid — never write state.tab directly */
function jumpTo(id){
  switch(id){
    case 'location': openLocation(state.locId||'garage'); break;
    case 'container': openContainer(state.ctId||'c2','browse'); break;
    case 'item': {const it=IT.find(x=>x.id===state.itemId)||IT[0];
      state.ctId=it.ct; state.ctFrom='browse'; openItem(it.id,'container'); break;}
    case 'add': openAdd(state.ctId||'c2'); break;
    case 'pair': scanUnknown(); break;
    case 'scan': openScan(); break;
    case 'scanSuccess': state.scanFrom=state.scanFrom||'home'; scanSuccess('c2'); break;
    default: go(id);
  }
}
document.getElementById('jumpBtn').onclick=()=>{
  const names=SCREENS.map((s,i)=>`${i+1}. ${s[1]}`).join('\n');
  const pick=prompt('Jump to screen (1–'+SCREENS.length+'):\n\n'+names,'1');
  if(!pick)return;const idx=parseInt(pick,10)-1;if(idx<0||idx>=SCREENS.length)return;
  jumpTo(SCREENS[idx][0]);
};
document.getElementById('themeBtn').onclick=toggleTheme;

/* init */
applyTheme();render(true);
</script>
